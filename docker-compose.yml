# OnboardIQ - full stack: PostgreSQL + Python AI service + Node API + React web
#   docker compose up --build
#   Web:  http://localhost:8080      API docs: http://localhost:4000/api/docs      AI: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onboardiq
      POSTGRES_PASSWORD: onboardiq
      POSTGRES_DB: onboardiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardiq -d onboardiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    environment:
      SERVICE_KEY: ${SERVICE_KEY:-change-me-service-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
    ports:
      - "8000:8000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://onboardiq:onboardiq@db:5432/onboardiq
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      SERVICE_KEY: ${SERVICE_KEY:-change-me-service-key}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-mock}
      AI_SERVICE_URL: http://ai-service:8000
      CORE_BANKING_URL: http://localhost:4000/internal/core-banking
      DEMO_BUSINESS_DATE: ${DEMO_BUSINESS_DATE:-2026-03-05}
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      SEED_ON_START: "true"
      STORAGE_DIR: storage/documents
    ports:
      - "4000:4000"
    volumes:
      - storage:/app/storage
      - ./output:/app/output

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  storage:
