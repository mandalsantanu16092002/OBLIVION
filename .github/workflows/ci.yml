name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: onboardiq, POSTGRES_PASSWORD: onboardiq, POSTGRES_DB: onboardiq_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U onboardiq" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://onboardiq:onboardiq@localhost:5432/onboardiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install
      - run: pip install -r apps/ai-service/requirements.txt
      - run: npm run typecheck
      - run: npm run verify:sample
      - run: npm run test:rules
      - run: npm run test:ai
      - run: npm run test:api
